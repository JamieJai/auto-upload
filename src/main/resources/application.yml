spring:
  application:
    name: autoreg-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:autoreg}
    username: ${DB_USER:autoreg}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

autoreg:
  admin:
    user: ${AUTOREG_ADMIN_USER:}
    password: ${AUTOREG_ADMIN_PASSWORD:}
  master-key: ${AUTOREG_MASTER_KEY:}
  image-root: ${AUTOREG_IMAGE_ROOT:/data/images}

---
spring:
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 300MB

---
autoreg:
  llm:
    provider: ${AUTOREG_LLM_PROVIDER:claude-cli}
    command: ${AUTOREG_LLM_COMMAND:claude}
    model: ${AUTOREG_LLM_MODEL:sonnet}
    timeout-seconds: 180
    max-concurrency: 2
  worker:
    poll-ms: 2000
